<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="hero-content">

        <div class="hero-text">
            <h1>Student Expense Tracker</h1>
            <p>Track your expenses. Manage your money. Spend smarter.</p>
        </div>

        <div class="hero-image">
            <img src="student-expense.png" alt="Student managing personal expenses">
        </div>

    </div>
    </header>

    <!-- Dashboard -->
    <section class="dashboard">

        <div class="summary-card">
            <h3><b>Total Spent</b></h3>
            <p id="totalAmount">₹0</p>
        </div>

        <div class="summary-card">
            <h3><b>Total Expenses</b></h3>
            <p id="totalExpenses">0</p>
        </div>

        <div class="summary-card">
            <h3><b>Highest Expense</b></h3>
            <p id="highestExpense">₹0</p>
        </div>

    </section>

    <!-- Add Expense Section -->
    <section class="expense-form-section">

        <h2>Add New Expense</h2>

        <form id="expenseForm">

            <label for="expenseName">Expense Name</label>
            <input type="text" id="expenseName" placeholder="e.g. Lunch">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="e.g. 150">

            <label for="category">Category</label>
            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Education">Education</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <label for="date">Date</label>
            <input type="date" id="date">

            <button type="submit">Add Expense</button>

        </form>

    </section>

    <!-- Search and Filter -->
    <section class="filter-section">

        <h2>Search & Filter</h2>

        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search expenses..."
        >

        <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Education">Education</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
        </select>

    </section>

    <!-- Expense List -->
    <section class="expense-list-section">

        <h2>Recent Expenses</h2>

        <div id="expenseList">
            <!-- Expenses will appear here using JavaScript -->
        </div>

    </section>
	<!-- Spending Summary -->
<section class="summary-section">

    <h2>Spending Summary</h2>

    <div id="categorySummary">
        <!-- Category totals will appear here -->
    </div>

</section>

    <script src="script.js"></script>

</body>
</html>
